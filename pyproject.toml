[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/migrations"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["app", "nexora"]
omit = [
    "app/e2e_tests.py",
    "app/migrations/*",
    "manage.py",
    "nexora/asgi.py",
    "nexora/wsgi.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
