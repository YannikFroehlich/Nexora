services:
  web:
    build:
      context: .
    container_name: nexora
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
